version: "3.8"

services:
  gateway:
    build: .
    container_name: faas-gateway
    ports:
      - "8080:8080"
    environment:
      - FAAS_AUTH_TOKEN=${FAAS_AUTH_TOKEN:-}
    networks:
      - faas-network
    restart: unless-stopped
    labels:
      - faas.gateway=true

networks:
  faas-network:
    name: faas-network
