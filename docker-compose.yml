version: '3.8'

services:
  gateway:
    build: .
    container_name: faas-gateway
    environment:
      - FAAS_AUTH_TOKEN=${FAAS_AUTH_TOKEN:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
    networks:
      - faas-network
    restart: unless-stopped
    labels:
      - faas.gateway=true

networks:
  faas-network:
    name: faas-network
    external: true